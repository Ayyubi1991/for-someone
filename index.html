<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Untuk kamu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbe9ec; --rose:#e9a3b0; --rose-deep:#d9798c; --rose-light:#f3c1ca;
    --paper:#fffaf6; --ink:#5a2f3b; --line:#f0d9dc;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Newsreader",Georgia,serif;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow:hidden;
  }
  .screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
  .screen.active{display:flex}
  h1,h2{font-family:"Caveat",cursive;font-weight:700;margin:0}
  .hint{margin:22px 0 0;font-style:italic;opacity:.75;font-size:1.05rem}

  /* ---------- Layar 1: amplop ---------- */
  .env{position:relative;width:min(80vw,330px);height:215px;background:var(--rose);border-radius:10px;cursor:pointer;border:0;padding:0;
       box-shadow:0 14px 30px -12px rgba(150,60,80,.45)}
  .env::before{content:"";position:absolute;inset:0;border-radius:10px;background:var(--rose-light);
       clip-path:polygon(0 100%,0 28%,50% 64%,100% 28%,100% 100%)}
  .flap{position:absolute;left:0;top:0;width:100%;height:62%;background:var(--rose-deep);border-radius:10px 10px 0 0;
       clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .7s ease;z-index:2}
  .env.open .flap{transform:rotateX(180deg)}
  .seal{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:3;font-size:2rem;transition:opacity .3s}
  .env.open .seal{opacity:0}
  .env:focus-visible{outline:3px solid var(--ink);outline-offset:6px}
  .env-title{font-size:2.6rem;margin-bottom:26px}

  /* ---------- Layar 2: surat ---------- */
  .letter{width:min(92vw,460px);max-height:76vh;overflow:auto;text-align:left;background:var(--paper);
       padding:30px 28px 26px;border-radius:6px;box-shadow:0 18px 36px -16px rgba(150,60,80,.5);
       background-image:repeating-linear-gradient(transparent 0 31px,var(--line) 31px 32px);background-position:0 54px}
  .letter h2{font-size:2.4rem;margin-bottom:14px}
  .letter p{margin:0 0 32px;line-height:32px;font-size:1.12rem}
  .letter .sign{font-family:"Caveat",cursive;font-size:1.9rem;line-height:1.2;margin:8px 0 0;text-align:right}
  .btn{margin-top:22px;font:inherit;font-size:1.1rem;background:var(--rose-deep);color:#fff;border:0;border-radius:999px;
       padding:12px 26px;cursor:pointer}
  .btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

  /* ---------- Layar 3: bubble wrap ---------- */
  .wrap-title{font-size:2.4rem}
  .count{margin:6px 0 18px;font-size:1rem;opacity:.75}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(88vw,380px);padding:16px;background:var(--paper);border-radius:14px;
        box-shadow:0 18px 36px -16px rgba(150,60,80,.5)}
  .bub{aspect-ratio:1;border-radius:50%;border:0;padding:0;cursor:pointer;
       background:radial-gradient(circle at 34% 30%,#fff 0 9%,var(--rose-light) 10% 38%,var(--rose) 100%);
       box-shadow:inset 0 -4px 7px rgba(150,60,80,.25),0 3px 5px rgba(150,60,80,.2);
       transition:transform .12s ease}
  .bub:active{transform:scale(.88)}
  .bub.popped{background:var(--line);box-shadow:inset 0 2px 4px rgba(150,60,80,.18);transform:scale(.82);cursor:default}
  .bub:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .final{margin-top:22px;max-width:360px;font-size:1.15rem;line-height:1.55;opacity:0;transition:opacity .9s ease;min-height:3em}
  .final.show{opacity:1}

  @media (prefers-reduced-motion:reduce){.flap,.final{transition:none}}
</style>
</head>
<body>

<!-- ============================================================
     EDIT TEKS DI SINI SAJA. Ganti yang ada di dalam tanda kutip "..."
     Jangan hapus tanda kutip atau koma di ujung baris.
     ============================================================ -->
<script>
const CONFIG = {
  // Layar 1 (amplop)
  judulAmplop: "Ada sesuatu buat kamu",
  petunjukAmplop: "Ketuk amplopnya",

  // Layar 2 (surat)
  nama: "Sayang",                       // jadi "Dear Sayang,"
  paragraf: [                           // satu baris = satu paragraf, tambah/hapus sesukamu
    "i know kata maaf kadang belum cukup, but aku mau kamu tawu kalo aku sungguh menyesal.",
    "i'm so sorry again about my fault 😔 aku udaa membuat kamuu jadi begini and aku menyesali akan semua perbuatan aku ke kamu.. aku ama kamu maybe emang butuh waktu sendiri² dulu belakangan ini sampai any problem yang ada mulai hilang/selesai satu per satu, maapp yaaa sayaaangggg ☹️ aku gatau harus bilang apalagi ke kamu akan semua rasa sakit yang kamu terima dari aku sendiri, seharusnya aku lebih bisa dewasa dan mengontrol emosi aku sendiri kemarin² but i'm tired and kamu juga saat itu cape juga, maapp akuu terkadang egois sendiri akan diri aku.. and aku akhir² ini gabisa memeluk semua yang ada di dalam diri kamu mulai dari rasa lelah kamu, rasa sedih kamu, marah kamu, and anything 🙁 aku cuma mau memperbaiki hubungan kita ini lagi and engga nyerah untuk kedepannya, akuu kangenn sama kamuu ☹️ akan semua hal² random yang kamu ceritakan ke aku, akuu kangen kamu yang selalu nyariin aku 😕, akuu kangen kita yang selalu ngobrolin hal² apapun itu setiap hari 😕 everything about u kangenn, jadi akuu minta maap ke kamuu and aku mawuu memperbaiki hubungan kitaa.. pwiss 🥺🥺",
    "aku bingung gimana mau minta maaf ke kamu, and aku diemin kamu selama ini bukan berarti aku bosen ama kamu, bukan berarti aku udaa engga sayang ama kamu.. but aku mau ngebuat something yang maybe bisa membuat kamu engga bosen cuma baca long text aku.. everyday setelah aku pulang dari kampus, aku selalu ngerjain web yang aku buat ini cuma khusus untuk kamu satu satunya, aku ngoding web ini pake perasaan² yang selalu aku kuat² in tiap malem, gimana caranya aku ngebuat ini itu and nyari banyak referensi biar menarik, aku gapeduli aku tiap malem tidur jam berapa yang penting aku udah nargetin malem ini sampe mana, kalo boleh jujur terkadang aku nangis ngebikin web ini karen setengah program yang ada disini isinya dari perasaan aku sendiri, cukup kursi, meja belajar, dan laptop aku yang jadi saksi bisu akan keseriusan aku untuk menyelesaikan web ini untuk kamu, ada suatu momen aku ketiduran di depan laptop aku dan tidur di meja aku sendiri, aku kebangun jam 2 pagi and aku gabisa tidur.. akupun menyelesaikan lagi akan web ini, engga sadar tiba² udah jam 5 pagi and aku memulai hari² ku seperti biasanya meski aku merindukan kamu but aku tahan and aku keep sementara, saat aku pulang maka aku mulai mengerjakan web ini lagi and seterusnya, demikian website ini aku buat dengan sepenuh hati dan ikhlas untuk kamu satu² nya.",
    "LOVEE U SO MUCH 🤍🤍\nand sorry about everything.\n\nthank u udaa mawu buka and baca web yang kubuat dari inisiatif diri aku sendiri buat kamu.."
  ],
  penutup: "Dari aku,",
  pengirim: "Namamu",
  tombolLanjut: "Lanjut",

  // Layar 3 (bubble wrap)
  judulBubble: "Pecahin dulu, yuk",
  petunjukBubble: "Ketuk bulatannya satu-satu",
  jumlahBubble: 30,                     // sebaiknya kelipatan 5
  pesanAkhir: "Semua sudah pecah. Semoga hatimu ikut lega ya. Aku sayang kamu."
};
</script>

<main>
  <section class="screen active" id="s1">
    <h1 class="env-title" id="t1"></h1>
    <button class="env" id="env" aria-label="Buka amplop">
      <span class="flap"></span><span class="seal" aria-hidden="true">💗</span>
    </button>
    <p class="hint" id="h1"></p>
  </section>

  <section class="screen" id="s2">
    <article class="letter" id="letter"></article>
    <button class="btn" id="next"></button>
  </section>

  <section class="screen" id="s3">
    <h2 class="wrap-title" id="t3"></h2>
    <p class="count" id="count"></p>
    <div class="grid" id="grid"></div>
    <p class="final" id="final" aria-live="polite"></p>
  </section>
</main>

<script>
(function(){
  const C = CONFIG;
  const $ = id => document.getElementById(id);
  function show(id){
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
  }

  // Layar 1
  $('t1').textContent = C.judulAmplop;
  $('h1').textContent = C.petunjukAmplop;
  $('env').addEventListener('click', function(){
    this.classList.add('open');
    setTimeout(() => show('s2'), 750);
  }, {once:true});

  // Layar 2
  const letter = $('letter');
  const h = document.createElement('h2'); h.textContent = 'Dear ' + C.nama + ','; letter.appendChild(h);
  C.paragraf.forEach(t => { const p = document.createElement('p'); p.textContent = t; letter.appendChild(p); });
  const s1 = document.createElement('p'); s1.className = 'sign'; s1.textContent = C.penutup; letter.appendChild(s1);
  const s2 = document.createElement('p'); s2.className = 'sign'; s2.textContent = C.pengirim; letter.appendChild(s2);
  $('next').textContent = C.tombolLanjut;
  $('next').addEventListener('click', () => show('s3'));

  // Layar 3
  $('t3').textContent = C.judulBubble;
  let popped = 0; const total = C.jumlahBubble;
  function updateCount(){ $('count').textContent = popped === 0 ? C.petunjukBubble : popped + ' / ' + total; }
  updateCount();

  let ctx;
  function pop(){
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(ctx.sampleRate * 0.06);
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for(let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
      const src = ctx.createBufferSource(); src.buffer = buf;
      const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900 + Math.random()*900;
      src.connect(f); f.connect(ctx.destination); src.start();
    }catch(e){}
    if(navigator.vibrate) navigator.vibrate(12);
  }

  const grid = $('grid');
  for(let i = 0; i < total; i++){
    const b = document.createElement('button');
    b.className = 'bub'; b.setAttribute('aria-label', 'Bubble ' + (i+1));
    b.addEventListener('click', function(){
      if(b.classList.contains('popped')) return;
      b.classList.add('popped'); pop(); popped++; updateCount();
      if(popped === total){
        $('count').textContent = '';
        const f = $('final'); f.textContent = C.pesanAkhir;
        requestAnimationFrame(() => f.classList.add('show'));
      }
    });
    grid.appendChild(b);
  }
})();
</script>
</body>
</html>
